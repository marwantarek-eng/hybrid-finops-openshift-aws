apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: finops-db-secret
  namespace: finops-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: my-secret-store
    kind: SecretStore
  target:
    name: finops-app-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: finops-db-credentials